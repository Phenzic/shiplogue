
name: Publish to Visual Studio Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vsce 4.x requires Node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish extension
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc

      - name: Package VSIX for Open VSX
        run: npx --yes @vscode/vsce@4.1.0 package --out shiplogue.vsix
      - name: Publish to Open VSX
        run: npx --yes ovsx publish shiplogue.vsix -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version extension/package.json)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" shiplogue.vsix --clobber
          else
            gh release create "$TAG" shiplogue.vsix --title "Release v${VERSION}" --notes-file RELEASE_NOTES_0.1.8.md
          fi
