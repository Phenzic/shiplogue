
name: Publish to Visual Studio Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vsce 4.x requires Node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish extension
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc

      # Open VSX: uncomment these two steps once the `phenzic` namespace is
      # approved. Add an OVSX_TOKEN repository secret first
      # (open-vsx.org -> Settings -> Access Tokens).
