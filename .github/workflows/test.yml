name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # The Cursor tests build synthetic state.vscdb files with the sqlite3
      # CLI. macOS/Ubuntu runners ship it; the Windows image does not, and the
      # 10 cursor tests fail with `spawnSync sqlite3 ENOENT` without it.
      - name: Install sqlite3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite --no-progress -y
          sqlite3 --version
      - run: npm ci
      - run: npm test
        # Gated suites (SHIPLOGUE_E2E, CURSOR_REAL_DB) skip automatically without
        # a local Ollama / Cursor install.
